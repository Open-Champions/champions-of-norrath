name: Norrath reconstruction checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.10'}
          - {os: macos-15, python: '3.13'}
          - {os: macos-15-intel, python: '3.13'}
          - {os: windows-2025, python: '3.13'}
          - {os: windows-11-arm, python: '3.13'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Validate tools with synthetic fixtures only
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Check current authored source and saved receipt consistency
        run: python tools/rebuild.py check --report targets/SLUS-20565/verification.json --require-matches
      - name: Check experimental source publication integrity
        run: python tools/check_source_snapshot.py
      - name: Validate the published partial-build source plan without target tools
        run: python tools/build_partial.py --source-root experimental --plan experimental/build-plan.json --check-plan
